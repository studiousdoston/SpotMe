# SpotMe: serves the built web app (web/dist) and forwards /api to FastAPI (uvicorn on 127.0.0.1:8020).
# HTTP only on purpose: `sudo certbot --nginx -d spotme.72-60-208-46.sslip.io` adds HTTPS and the redirect.
# Install: see deploy/README.md.

server {
    listen 80;
    listen [::]:80;
    server_name spotme.72-60-208-46.sslip.io;

    root /opt/doston/spotme/web/dist;
    index index.html;

    # Requests carry pose landmarks as JSON (raw video never leaves the browser); a long set is a few MB.
    client_max_body_size 10M;

    # Compress text responses (HTML is always included by Nginx, so it isn't listed).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    # API: no URI part after the port, so the /api/... path is passed to FastAPI unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Analysis of a long set takes a few seconds; leave headroom.
        proxy_read_timeout 60s;
    }

    # Vite's hashed files (name changes whenever content changes): cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The app shell must never be cached, so a deploy is picked up on the next visit.
    # (The SPA fallback below also ends up here, so every page route gets this header.)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: real files are served as-is, every other path (/results, /history) gets the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
